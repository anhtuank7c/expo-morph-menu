# Publishes to npm when a version tag is pushed (`npm version minor && git push --follow-tags`).
#
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored
# in the repository. One-time setup on npmjs.com: package settings →
# Trusted publisher → GitHub Actions, repository anhtuank7c/expo-morph-menu,
# workflow file release.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run check
      - run: npm run test:api

      # prepack builds lib/ (clean + tsc). A version that is already on npm (for
      # example published by hand) is skipped, so the GitHub release still runs.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "expo-morph-menu@$version" version >/dev/null 2>&1; then
            echo "expo-morph-menu@$version is already on npm, skipping publish"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

      - name: GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
