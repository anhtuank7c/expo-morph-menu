name: Bug report
description: Something in expo-morph-menu does not work as documented
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. English or Vietnamese is fine.
        Security problem? Do not file it here, see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code and steps that show the problem. A change to the `example/` app or a link to a repository is best.
      placeholder: |
        1. Open the menu
        2. Tap "Camera"
        3. Drag down from the middle of the screen
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: expo-morph-menu version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `npx expo --version` and `npm ls react-native react-native-reanimated react-native-gesture-handler expo-router`.
      render: text
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: 'iPhone 16 simulator, iOS 27 / Pixel 8, Android 16 / Chrome 140'
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Expo Go
        - Development build
        - Release build
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Card surface
      description: The `surface` config value, or what `'auto'` resolved to.
      options:
        - auto / not sure
        - glass (Liquid Glass)
        - blur
        - solid
        - custom Background slot

  - type: textarea
    id: media
    attributes:
      label: Recording or screenshots
      description: Drag a screen recording here for anything visual.

  - type: textarea
    id: trace
    attributes:
      label: Morph trace (for flicker or jumps)
      description: |
        Visual bugs often last one frame. Render `<MorphTrace enabled />` inside `MorphProvider`,
        reproduce the bug and paste the `[morph]` log lines, especially those flagged FLICKER, HOLE, GHOST or OVERLAP.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the Troubleshooting section of the integration guide.
          required: true
        - label: The bug still happens after clearing the Metro cache (`npx expo start -c`).
