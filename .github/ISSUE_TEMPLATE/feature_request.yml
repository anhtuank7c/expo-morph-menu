name: Feature request
description: Suggest a new option, slot, callback or behavior
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. An API sketch (props, config keys, hook) helps.
      render: tsx

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried, for example a custom slot or a wrapper component.

  - type: dropdown
    id: platform
    attributes:
      label: Platforms it applies to
      multiple: true
      options:
        - iOS
        - Android
        - Web

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
