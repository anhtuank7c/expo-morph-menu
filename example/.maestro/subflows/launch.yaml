# Mở app trong Expo Go từ Metro và chờ màn Home.
# METRO_URL do scripts/e2e.mjs truyền vào (-e). KHÔNG khai báo khối `env:` ở
# đây: giá trị trong file đè lên giá trị truyền từ CLI.
appId: host.exp.exponent
---
# Tắt hẳn Expo Go trước: với bundle --no-dev không có fast refresh, mở link
# khi app còn sống sẽ chạy tiếp code CŨ. `launchApp` (thay vì `stopApp` rồi
# `openLink` ngay) chờ Expo Go lên hẳn, link không bị rơi về launcher.
- launchApp:
    stopApp: true
- openLink: ${METRO_URL || 'exp://127.0.0.1:8081'}

# Chờ FAB. KHÔNG chờ chữ "Morphing Menu": màn tải bundle của Expo Go cũng hiện
# tên app. Trong lúc chờ, dọn những thứ Expo Go có thể chèn lên che FAB.
- repeat:
    while:
      notVisible:
        id: 'morph-fab'
    times: 45
    commands:
      # Link tới khi Expo Go còn đang khởi tạo thì bị nuốt, app nằm ở màn Home
      # của Expo Go ("Development servers") — mở lại link.
      - runFlow:
          when:
            visible: 'Development servers'
          commands:
            - openLink: ${METRO_URL || 'exp://127.0.0.1:8081'}
      # Lần đầu chạy (hoặc sau khi xoá dữ liệu Expo Go): màn giới thiệu.
      - runFlow:
          when:
            visible: 'This is the developer menu.*'
          commands:
            - tapOn: 'Continue'
      # "Continue" mở tiếp dev menu đầy đủ: đóng bằng back.
      - runFlow:
          when:
            visible: 'Toggle performance monitor'
          commands:
            - pressKey: back
      - extendedWaitUntil:
          visible:
            id: 'morph-fab'
          timeout: 2000
          optional: true

# Nếu lần trước bị ngắt giữa chừng mà sheet còn mở thì đóng lại.
- runFlow:
    when:
      visible:
        id: 'morph-close'
    commands:
      - tapOn:
          id: 'morph-close'
      - waitForAnimationToEnd
- assertVisible:
    id: 'morph-fab'
