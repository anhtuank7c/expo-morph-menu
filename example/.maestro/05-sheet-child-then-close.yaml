# Drill vào màn con rồi lùi ra bằng back cứng: màn con → màn gốc sheet →
# đóng full screen (menu ở lại) → đóng menu.
appId: host.exp.exponent
name: Màn con rồi đóng
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/open-sheet.yaml
    env:
      ITEM: checkin
- extendedWaitUntil:
    visible: "Mở màn hình con"
    timeout: 5000
- tapOn: "Mở màn hình con"
- extendedWaitUntil:
    visible: "Màn hình con"
    timeout: 5000
- pressKey: back          # về màn gốc của sheet (native-stack)
- extendedWaitUntil:
    visible:
      id: "morph-close"
    timeout: 5000
- pressKey: back          # đóng full screen
- runFlow: subflows/assert-menu-open.yaml
- pressKey: back          # đóng menu
- runFlow: subflows/assert-home.yaml
