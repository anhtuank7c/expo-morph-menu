# ITEM: camera | store | audio | checkin
# Mở menu nếu chưa mở (sau khi đóng full screen, menu vẫn mở sẵn — chạm vào
# chỗ FAB lúc đó sẽ trúng dòng "Check In" của card), rồi chọn ITEM.
appId: host.exp.exponent
---
- runFlow:
    when:
      notVisible:
        id: "menu-item-camera"
    file: open-menu.yaml
- tapOn:
    id: "menu-item-${ITEM}"
- extendedWaitUntil:
    visible:
      id: "sheet-close"
    timeout: 5000
- waitForAnimationToEnd
# Hồi quy: khi sheet đang mở, overlay không được còn ở trạng thái 'open'
# (scrim của menu từng phủ lên sheet và nuốt cú chạm nút ×).
- assertNotVisible:
    id: "menu-scrim"
- assertNotVisible:
    id: "menu-item-camera"
