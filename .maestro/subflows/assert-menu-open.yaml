# Sau khi đóng full screen với closeMenuOnDismiss = false (mặc định): vỏ đã
# thu về card và menu VẪN MỞ — dòng bấm được, scrim có mặt.
appId: host.exp.exponent
---
- waitForAnimationToEnd
- assertNotVisible:
    id: "sheet-close"
- assertVisible:
    id: "menu-item-camera"
- assertVisible:
    id: "menu-scrim"
